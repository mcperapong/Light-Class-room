<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index</title>
<style>
:root{--bg:#f4f6f8;--fg:#1c2530;--card:#fff;--ac:#e0a100;--ln:#2b3a4d;color-scheme:light;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--fg:#eef1f5;--card:#1e252e;--ln:#9fb3c8;color-scheme:dark}}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;padding:12px;line-height:1.5}
h1{font-size:1.25rem;margin:4px 0 10px;text-align:center}
.stage{position:relative;max-width:980px;margin:0 auto;border-radius:10px;overflow:hidden;background:#000}
.stage img{display:block;width:100%;height:auto;transition:filter 1.2s ease}
.s1 img{filter:none}
.s2 img{filter:brightness(.4) saturate(.7) hue-rotate(-8deg)}
.s3 img{filter:brightness(.03) saturate(.2)}
.glow{position:absolute;top:2%;width:30%;height:9%;background:radial-gradient(ellipse,rgba(255,255,235,.85),rgba(255,255,220,0) 70%);transition:opacity 1.2s;pointer-events:none}
.g1{left:19%}.g2{left:63%}
.s2 .glow,.s3 .glow{opacity:0}
svg.rays{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity 1s}
.s2 .r-lamp,.s3 .r-lamp,.s3 .r-win{opacity:0}
.r-lamp,.r-win{transition:opacity 1s}
.ray{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:26 20;animation:flow 1.2s linear infinite}
.ray.a{stroke:#ffd84d}.ray.b{stroke:#ffb020}.ray.w{stroke:#8fd0ff}
@keyframes flow{to{stroke-dashoffset:-46}}
@media (prefers-reduced-motion:reduce){.ray{animation:none}}
.badge{position:absolute;left:10px;top:10px;padding:6px 12px;border-radius:20px;font-weight:700;background:#ffd84d;color:#222}
.s2 .badge{background:#8fd0ff}.s3 .badge{background:#222;color:#ddd;border:1px solid #666}
.cap{max-width:980px;margin:12px auto 0;background:var(--card);border-radius:10px;padding:12px 14px;min-height:5em;font-size:1.05rem}
.btns{max-width:980px;margin:10px auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;padding:12px 16px;border-radius:10px;border:2px solid var(--ln);background:var(--card);color:var(--fg);cursor:pointer;min-height:48px}
button.on{background:var(--ac);border-color:var(--ac);color:#222}
button:focus-visible{outline:3px solid #3a8dff;outline-offset:2px}
.hint{max-width:980px;margin:8px auto 0;font-size:.9rem;opacity:.75;text-align:center}
.btns.sm button{font-weight:600;padding:8px 12px;min-height:44px}
</style></head><body>

['ไฟเปิด','แสงจากหลอดไฟตกกระทบโต๊ะและเก้าอี้ แล้วสะท้อนเข้าตา (ลูกศรเส้นประแสดงทางเดินของแสง) เราจึงมองเห็นชัดเจน','ตอนนี้เปิดไฟอยู่ แสงจากหลอดไฟเดินทางไปตกกระทบโต๊ะ เก้าอี้ และกระดาน วัตถุเหล่านั้นสะท้อนแสงบางส่วนเข้ามาที่ตาของเรา ตารับแสงแล้วส่งสัญญาณไปให้สมอง สมองจึงแปลผลว่าเรามองเห็นสิ่งของ'],
['ไฟปิด แต่ยังมีแสงจากหน้าต่าง','แสงแดดจากหน้าต่างยังตกกระทบวัตถุอยู่บ้าง จึงมีแสงสะท้อนเข้าตาน้อยลง ห้องดูมืดลงแต่ยังพอมองเห็นได้','ตอนนี้ปิดไฟแล้ว แต่ยังมีแสงแดดเข้ามาทางหน้าต่าง แสงมีน้อยลง วัตถุจึงสะท้อนแสงเข้าตาได้น้อยลง ห้องจึงดูมืดลง แต่เรายังพอมองเห็นสิ่งของได้'],
['ไม่มีแสงเลย','ไม่มีแสงตกกระทบวัตถุ จึงไม่มีแสงสะท้อนเข้าตา เราจึงมองไม่เห็นสิ่งของ แม้วัตถุยังอยู่ที่เดิม','ตอนนี้ไม่มีแสงเลย วัตถุไม่มีแสงให้สะท้อนเข้าตา ตาจึงไม่ได้รับแสงจากวัตถุ เราจึงมองไม่เห็นอะไร ทั้งที่สิ่งของยังอยู่ที่เดิม นี่แสดงว่าเรามองเห็นได้เพราะมีแสง']];
var stage=document.getElementById('stage'),cap=document.getElementById('cap'),badge=document.getElementById('badge'),hint=document.getElementById('hint');
var bs=[b1,b2,b3],cur=0,auto=false,autoT=null,snd=true,voiceOn=true,tok=0,AC=null;
function ctx(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}return AC}
function click(a,t,vol){var n=Math.floor(a.sampleRate*0.04),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
for(var k=0;k<n;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/n,3);
var src=a.createBufferSource();src.buffer=buf;var g=a.createGain();g.gain.value=vol;src.connect(g);g.connect(a.destination);src.start(t);
var o=a.createOscillator(),g2=a.createGain();o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(60,t+.08);
g2.gain.setValueAtTime(vol*.8,t);g2.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g2);g2.connect(a.destination);o.start(t);o.stop(t+.12)}
function sfx(on){if(!snd)return;var a=ctx();if(!a)return;var t=a.currentTime;click(a,t,.5);
if(on){var o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=100;
g.gain.setValueAtTime(0,t);var f=[.05,.1,.15,.22,.3,.38];[0,.07,.12,.2,.28,.36].forEach(function(x,k){g.gain.setValueAtTime(k%2?0.005:0.05,t+x+.03)});
g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+1)}}
function stopVoice(){tok++;if(window.speechSynthesis)speechSynthesis.cancel()}
function speak(i,done){var my=++tok,fin=false;function end(){if(fin||my!==tok)return;fin=true;if(done)done()}
if(!window.speechSynthesis){hint.textContent='เบราว์เซอร์นี้ไม่รองรับเสียงอธิบาย ลองเปิดลิงก์ด้วย Chrome หรือ Safari';setTimeout(end,4500);return}
if(!voiceOn){setTimeout(end,4500);return}
speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(T[i][2]);u.lang='th-TH';u.rate=.9;
var v=speechSynthesis.getVoices().filter(function(x){return /^th/i.test(x.lang)});
if(v.length){u.voice=v[0];hint.textContent='ใช้เสียง: '+v[0].name}else hint.textContent='เครื่องนี้อาจไม่มีเสียงภาษาไทย ถ้าไม่ได้ยินเสียงให้อ่านคำอธิบายใต้ภาพแทน';
u.onend=end;u.onerror=function(e){hint.textContent='เล่นเสียงไม่ได้ ('+(e&&e.error?e.error:'ไม่ทราบสาเหตุ')+') ลองเปิดลิงก์ด้วย Chrome หรือ Safari โดยตรง';end()};speechSynthesis.speak(u);setTimeout(end,T[i][2].length*190+4000)}
function set(i,fromAuto){var prev=cur;cur=i;stage.className='stage s'+(i+1);badge.textContent=T[i][0];cap.textContent=T[i][1];
bs.forEach(function(b,k){b.classList.toggle('on',k===i)});
if(i===0&&prev!==0)sfx(true);else if(prev===0&&i!==0)sfx(false);
speak(i,function(){if(auto)autoT=setTimeout(function(){set((cur+1)%3,true)},1500)})}
function stopAuto(){auto=false;clearTimeout(autoT);bAuto.classList.remove('on');bAuto.textContent='เล่นอัตโนมัติ'}
bs.forEach(function(b,k){b.onclick=function(){ctx();stopAuto();set(k)}});
bAuto.onclick=function(){ctx();if(auto){stopAuto();stopVoice();return}auto=true;bAuto.classList.add('on');bAuto.textContent='หยุดเล่น';set((cur+1)%3,true)};
bSnd.onclick=function(){snd=!snd;bSnd.classList.toggle('on',snd);bSnd.textContent='เสียงเปิด-ปิดไฟ: '+(snd?'เปิด':'ปิด')};
bVoice.onclick=function(){voiceOn=!voiceOn;bVoice.classList.toggle('on',voiceOn);bVoice.textContent='เสียงอธิบาย: '+(voiceOn?'เปิด':'ปิด');if(!voiceOn)stopVoice()};
bReplay.onclick=function(){ctx();clearTimeout(autoT);speak(cur,function(){if(auto)autoT=setTimeout(function(){set((cur+1)%3,true)},1500)})};
if(window.speechSynthesis)speechSynthesis.getVoices();
cap.textContent=T[0][1];badge.textContent=T[0][0];b1.classList.add('on');
</script></body></html>
